name: zhixiang

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=128M
      - --innodb-log-buffer-size=8M
      - --performance-schema=OFF
      - --max-connections=30
      - --table-open-cache=256
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
    mem_limit: 384m
    mem_reservation: 192m
    pids_limit: 128
    environment:
      MYSQL_DATABASE: zhixiang
      MYSQL_USER: ${DB_USER:-zhixiang_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?请在 .env.docker 中设置 DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env.docker 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  db-init:
    build:
      context: .
      target: db-init
    restart: "no"
    mem_limit: 384m
    mem_reservation: 128m
    pids_limit: 128
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: zhixiang
      DB_USER: ${DB_USER:-zhixiang_app}
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env.docker 中设置 DB_PASSWORD}
      ROOT_DB_USER: root
      ROOT_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env.docker 中设置 MYSQL_ROOT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    mem_limit: 448m
    mem_reservation: 192m
    pids_limit: 256
    environment:
      PORT: 3000
      NODE_OPTIONS: --max-old-space-size=256
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: zhixiang
      DB_USER: ${DB_USER:-zhixiang_app}
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env.docker 中设置 DB_PASSWORD}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-deepseek-v4-flash}
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - frontend
      - backend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    mem_limit: 64m
    mem_reservation: 16m
    pids_limit: 64
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./.deploy/nginx.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  frontend:
  backend:
    internal: true

volumes:
  mysql_data:
